name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ios-ipa.yml'
      - 'ios/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'bun.lock'
      - 'capacitor.config.ts'

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web bundle
        run: bun run build

      - name: Sync Capacitor iOS
        run: bunx cap sync ios

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -resolvePackageDependencies

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$APP_PATH"
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          /usr/bin/zip -qry ../Daftar-qarz-unsigned.ipa Payload
          cd ../..
          test -s build/Daftar-qarz-unsigned.ipa
          shasum -a 256 build/Daftar-qarz-unsigned.ipa | tee build/Daftar-qarz-unsigned.ipa.sha256

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Daftar-qarz-unsigned-ipa
          path: |
            build/Daftar-qarz-unsigned.ipa
            build/Daftar-qarz-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
