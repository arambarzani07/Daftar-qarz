name: CI Security & Quality Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: zhirox_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zhirox_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Enable TLS on PostgreSQL test service
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker ps --filter 'ancestor=postgres:15' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"

          cert_dir="$(mktemp -d)"
          openssl req -new -x509 -nodes -days 1 \
            -subj '/CN=localhost' \
            -keyout "$cert_dir/server.key" \
            -out "$cert_dir/server.crt"
          chmod 600 "$cert_dir/server.key"

          docker cp "$cert_dir/server.key" "$container_id:/var/lib/postgresql/server.key"
          docker cp "$cert_dir/server.crt" "$container_id:/var/lib/postgresql/server.crt"
          docker exec "$container_id" chown postgres:postgres /var/lib/postgresql/server.key /var/lib/postgresql/server.crt
          docker exec "$container_id" chmod 600 /var/lib/postgresql/server.key
          docker exec "$container_id" sh -lc "printf '\nssl = on\nssl_cert_file = '\''/var/lib/postgresql/server.crt'\''\nssl_key_file = '\''/var/lib/postgresql/server.key'\''\n' >> /var/lib/postgresql/data/postgresql.conf"
          docker restart "$container_id" >/dev/null

          for _ in $(seq 1 30); do
            if docker exec "$container_id" pg_isready -U postgres -d zhirox_test >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo 'PostgreSQL did not become ready after enabling TLS' >&2
          exit 1

      - name: TypeScript typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Migration Verification & Immutability Test
        env:
          POSTGRES_URL: postgres://postgres:postgrespassword@localhost:5432/zhirox_test
        run: bunx tsx scripts/verify_ledger_immutability.ts

      - name: Security Auth Boundary Tests
        env:
          POSTGRES_URL: postgres://postgres:postgrespassword@localhost:5432/zhirox_test
          SUPABASE_JWT_SECRET: test-supabase-jwt-secret-key-12345
        run: bunx tsx scripts/verify_auth_boundary.ts

      - name: Financial Core Invariant Proofs
        env:
          POSTGRES_URL: postgres://postgres:postgrespassword@localhost:5432/zhirox_test
        run: bunx tsx scripts/run_full_financial_proof.ts

      - name: Authorization Matrix Verification (32/32)
        env:
          POSTGRES_URL: postgres://postgres:postgrespassword@localhost:5432/zhirox_test
          SUPABASE_JWT_SECRET: test-supabase-jwt-secret-key-12345
        run: bunx tsx scripts/verify_full_matrix.ts

      - name: Production Bundle Build
        run: bun run build
